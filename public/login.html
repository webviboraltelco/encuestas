<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso — Panel Viboral Telecomunicaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./output.css" />
  <link rel="stylesheet" href="./design-tokens.css" />
</head>
<body class="panel-circuito min-h-screen flex flex-col items-center justify-center px-4 py-10">

  <svg class="lineas-circuito" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M20 12 L20 40 L70 40 L70 12" stroke="var(--color-borde)" stroke-width="0.3" fill="none" vector-effect="non-scaling-stroke" />
    <path d="M15 85 L45 85 L45 60 L80 60" stroke="var(--color-borde)" stroke-width="0.3" fill="none" vector-effect="non-scaling-stroke" />
    <circle cx="20" cy="12" r="0.8" fill="var(--color-marca)" />
    <circle cx="70" cy="40" r="0.8" fill="var(--color-marca)" />
    <circle cx="45" cy="85" r="0.8" fill="var(--color-acento-2)" />
    <circle cx="80" cy="60" r="0.8" fill="var(--color-acento-2)" />
  </svg>
  <div class="paquete-datos naranja"></div>
  <div class="paquete-datos cian"></div>

  <!-- Bloque de marca: arriba, centrado -->
  <div class="relative flex flex-col items-center text-center mb-8">
    <img
      src="./assets/logo.png"
      alt="Viboral Telecomunicaciones"
      class="mb-4"
      style="width: 3.5rem; height: 3.5rem; object-fit: contain; filter: drop-shadow(0 0 16px rgba(255, 161, 31, 0.55));"
    />
    <h1 class="font-semibold text-xl leading-snug mb-2" style="font-family: var(--font-display); color: var(--color-texto);">
      Panel de satisfacción
    </h1>
    <p class="text-sm max-w-xs" style="color: var(--color-texto-secundario);">
      Acceso exclusivo para gerencia y jefe de técnicos de Viboral Telecomunicaciones.
    </p>
  </div>


  <form
    id="form-login"
    class="relative w-full max-w-sm rounded-2xl border p-6 md:p-8 space-y-4"
    style="background: var(--color-superficie); border-color: var(--color-borde);"
  >
    <div>
      <label for="usuario" class="dato-tecnico block mb-1">Usuario</label>
      <input type="text" id="usuario" class="campo-login" autocomplete="username" required />
    </div>

    <div>
      <label for="password" class="dato-tecnico block mb-1">Contraseña</label>
      <input type="password" id="password" class="campo-login" autocomplete="current-password" required />
    </div>

    <p id="error-login" class="hidden text-sm texto-error"></p>

    <button
      type="submit"
      id="btn-ingresar"
      class="w-full font-medium text-sm py-2.5 rounded-lg"
      style="background: var(--color-marca); color: var(--color-fondo); box-shadow: 0 0 16px 2px rgba(255, 161, 31, 0.5);"
    >
      Ingresar
    </button>
  </form>

  <script type="module" src="../src/dashboard/auth.js"></script>
</body>
</html>
